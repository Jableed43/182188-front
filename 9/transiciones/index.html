<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1> Transiciones (Transition) </h1>
    <p> La transicion siempre se declara en el estado base, nunca en el :hover </p>

    <h2>Botón - transition all</h2>
    <button class="boton-magico">Hover acá</button>

    <h2>Transition width - height</h2>
    <div class="caja width-height">Transition width - height</div>

    <h2>Delay</h2>
    <div class="caja delay">Delay</div>

    <h2>ease</h2>
    <div class="caja ease-out">ease out</div>
    <div class="caja ease-in-out">ease in-out</div>
</body>
</html>
