<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformaciones - Transform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1> Transformaciones - Transform </h1>

        <h2>1. Traslación: Translate()</h2>
        <div class="caja caja-translate-y"> TranslateY </div>
        <div class="caja caja-translate-x"> TranslateX </div>

        <h2>2. Escala: Scale()</h2>
        <div class="caja caja-scale-up">Scale up</div>
        <div class="caja caja-scale-down">Scale down</div>

        <h2>3. Rotacion: Rotate()</h2>
        <div class="caja caja-rotate">Rotate</div>
        <div class="caja caja-rotate-2">Rotate 2</div>
        <div class="caja caja-rotate-3">Rotate 3</div>

        <h2> Inclinar bordes - Skew </h2>
        <div class="caja caja-skew">Skew</div>
        <div class="caja caja-skew-2">Skew X</div>
        <div class="caja caja-skew-3">Skew Y</div>

    </main>
</body>
</html>
