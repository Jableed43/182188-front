<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Aroma - Contacto</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/ef88cf4afb.js" crossorigin="anonymous"></script>
    <link rel="icon" type="imge/x-icon" href="assets/img/coffee.png">
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a href="./index.html" class="logo" ><i class="fa-solid fa-mug-hot"></i>Café Aroma</a>
        <ul class="nav-links" >
          <li><a href="./index.html">Inicio</a></li>
          <li><a href="./productos.html">Nuesto Café</a></li>
          <li><a href="./galeria.html">Galería</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <h1 class="page-title" >Contacto</h1>
    <section class="main-section">
      <form>
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" name="name" placeholder="Tu nombre" id="name" required>
        </div>

        <div class="form-group">
          <label for="name">Apellido</label>
          <input type="text" name="lastName" placeholder="Tu apellido" id="lastName" required>
        </div>

        <div class="form-group">
          <label for="phone">Teléfono</label>
          <input type="tel" name="phone" id="phone" placeholder="+54 11 1234-5678" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="youremail@mail.com" required>
        </div>

        <div class="form-group">
          <label for="reason">Motivo de contacto</label>
          <select name="reason" id="reason">
            <!-- disabled selected hacen que no puedan mandar esa opcion como valida -->
            <option value="" disabled selected >Selecciona una opción</option>
            <option value="reserva">Reserva de mesa</option>
            <option value="eventos">Pedidos para eventos</option>
            <option value="trabajo">Trabajá con nosotros</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <fieldset>
          <legend>¿Es tu primera vez en Café Aroma?</legend>
          <div class="radio-group">
            <div>
              <input type="radio" id="first-yes" name="first-visit" value="si" required >
              <label for="">si</label>
            </div>
            <div>
              <input type="radio" id="first-no" name="first-visit" value="no" required>
              <label for="">no</label>
            </div>
          </div>
        </fieldset>

        <div class="form-group">
          <label for="comment">Mensaje</label>
          <textarea name="comment" id="comment" placeholder="Contanos en qué te podemos ayudar" required cols="40" rows="5" maxlength="2000" minlength="1" ></textarea>
        </div>

        <div class="form-buttons">
          <button class="btn btn-primary" type="submit" >Enviar mensaje</button>
          <button class="btn btn-secondary" type="reset">Limpiar formulario</button>
        </div>

      </form>
    </section>
    <footer>
        <ul class="footer-nav">
            <li><a href="./index.html">Inicio</a></li>
            <li><a href="./productos.html">Nuesto Café</a></li>
            <li><a href="./galeria.html">Galería</a></li>
            <li><a href="./contacto.html">Contacto</a></li>
        </ul>
        <div class="footer-social">
            <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
        </div>
    </footer>
  </body>
</html>
